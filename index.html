<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regalos para Frijolito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
:root{
  --bg:#e6f3fc; --surface:#ffffff; --ink:#3a2a20; --muted:#7a6454; --line:#cfe2f0;
  --accent:#3d8fcb; --accent-ink:#ffffff; --soft:#dcecf8; --sun:#f5c96a; --ok:#2f8a5f; --ok-soft:#dff1e7; --danger:#b4473f;
  --bear:#9a6a45; --bear-dark:#6e4a2f; --bear-light:#d9b48f; --bubble:#9fd3f5; --bubble-edge:#ffffff;
  --display:"Fredoka","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1e2a; --surface:#172b39; --ink:#f2e7dc; --muted:#bfa995; --line:#264255;
  --accent:#86c6ef; --accent-ink:#0d1a24; --soft:#1d3a4f; --sun:#d9b955; --ok:#6cc79a; --ok-soft:#1d3a2d; --danger:#e48a82;
  --bear:#a8774f; --bear-dark:#7a5336; --bear-light:#dcbb98; --bubble:#3f86b8; --bubble-edge:#9fd3f5; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{pointer-events:none;position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.wrap>*{pointer-events:auto}
h1,h2{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.1;color:var(--bear-dark)}
h2{font-size:1.15rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
header{display:flex;gap:16px;align-items:center}
header .txt{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
header .oso-mini{width:92px;height:auto;flex:none;animation:gira 5s ease-in-out infinite;filter:drop-shadow(0 6px 5px rgba(0,0,0,.25))}
@keyframes gira{
  0%,100%{transform:perspective(420px) translateX(-8px) rotateY(-50deg)}
  50%{transform:perspective(420px) translateX(8px) rotateY(50deg)}
}
@keyframes gira-suave{
  0%,100%{transform:perspective(420px) translateX(-4px) rotateY(-18deg)}
  50%{transform:perspective(420px) translateX(4px) rotateY(18deg)}
}
.fondo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fondo .oso-grande{position:absolute;right:-40px;bottom:-30px;width:min(46vw,380px);opacity:.28}
.burbuja{position:absolute;bottom:-80px;border-radius:50%;background:radial-gradient(circle at 32% 30%,var(--bubble-edge) 0 12%,transparent 13%),radial-gradient(circle,color-mix(in srgb,var(--bubble) 35%,transparent) 55%,var(--bubble) 100%);border:1.5px solid color-mix(in srgb,var(--bubble) 70%,var(--bubble-edge));opacity:.75;animation:sube linear infinite;pointer-events:auto;cursor:pointer;transition:scale .25s ease-out,opacity .25s ease-out}
.burbuja.pop{animation-play-state:paused;scale:1.7;opacity:0}
@keyframes sube{
  0%{transform:translate(0,0) scale(.85)}
  25%{transform:translate(30px,-32vh) scale(.95)}
  50%{transform:translate(-24px,-64vh) scale(1)}
  75%{transform:translate(28px,-96vh) scale(1.05)}
  100%{transform:translate(-8px,-130vh) scale(1.1)}
}
.progress,.list,.chip,.card{box-shadow:0 1px 0 color-mix(in srgb,var(--line) 60%,transparent)}
.progress,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));width:0;transition:width .4s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.item{padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item.taken{cursor:default}
.item.taken .name{opacity:.55}
.item input[type=radio]{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.name{font-weight:700;min-width:0;flex:1 1 200px}
.pill{font-size:.78rem;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.falta{background:var(--soft);color:var(--accent)}
.pill.listo{background:var(--ok-soft);color:var(--ok)}
.prod{font-size:.88rem;font-weight:700;color:var(--accent);text-decoration:none}
.prod:hover{text-decoration:underline}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.nombres{display:flex;flex-direction:column;gap:8px}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:20px;max-width:min(420px,calc(100% - 32px));font:inherit}
dialog::backdrop{background:rgba(10,20,30,.55)}
dialog h2{color:var(--bear-dark);text-transform:none;letter-spacing:0;font-size:1.3rem;margin-bottom:10px}
dialog p+p{margin-top:8px}
dialog .actions{justify-content:flex-end;margin-top:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.msg{font-weight:700;min-height:1.5em}
.msg.ok{color:var(--ok)}
.msg.err{color:var(--danger)}
@media (max-width:440px){header .oso-mini{width:68px}.fondo .oso-grande{width:60vw;opacity:.2}}
@keyframes flota{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-14px)}}
@media (prefers-reduced-motion:reduce){header .oso-mini{animation:gira-suave 6s ease-in-out infinite}.bar>i{transition:none}.burbuja{animation:flota 7s ease-in-out infinite;bottom:auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="oso" viewBox="0 0 200 220">
  <circle cx="52" cy="40" r="26" fill="var(--bear)"/><circle cx="148" cy="40" r="26" fill="var(--bear)"/>
  <circle cx="52" cy="40" r="13" fill="var(--bear-light)"/><circle cx="148" cy="40" r="13" fill="var(--bear-light)"/>
  <ellipse cx="100" cy="160" rx="62" ry="56" fill="var(--bear)"/>
  <ellipse cx="100" cy="168" rx="36" ry="34" fill="var(--bear-light)"/>
  <ellipse cx="38" cy="140" rx="18" ry="28" transform="rotate(25 38 140)" fill="var(--bear)"/>
  <ellipse cx="162" cy="140" rx="18" ry="28" transform="rotate(-25 162 140)" fill="var(--bear)"/>
  <ellipse cx="62" cy="206" rx="26" ry="14" fill="var(--bear-dark)"/><ellipse cx="138" cy="206" rx="26" ry="14" fill="var(--bear-dark)"/>
  <ellipse cx="62" cy="205" rx="13" ry="7" fill="var(--bear-light)"/><ellipse cx="138" cy="205" rx="13" ry="7" fill="var(--bear-light)"/>
  <circle cx="100" cy="78" r="56" fill="var(--bear)"/>
  <ellipse cx="100" cy="96" rx="26" ry="20" fill="var(--bear-light)"/>
  <circle cx="80" cy="70" r="6" fill="var(--bear-dark)"/><circle cx="120" cy="70" r="6" fill="var(--bear-dark)"/>
  <circle cx="82" cy="68" r="2" fill="#ffffff"/><circle cx="122" cy="68" r="2" fill="#ffffff"/>
  <ellipse cx="100" cy="88" rx="9" ry="6.5" fill="var(--bear-dark)"/>
  <path d="M100 94 v6 M100 100 q-7 6 -12 1 M100 100 q7 6 12 1" stroke="var(--bear-dark)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="70" cy="90" r="7" fill="#f2a7a0" opacity=".45"/><circle cx="130" cy="90" r="7" fill="#f2a7a0" opacity=".45"/>
  <path d="M100 136 l-24 -12 v24 z M100 136 l24 -12 v24 z" fill="var(--accent)"/><circle cx="100" cy="136" r="6" fill="var(--accent)"/>
</symbol></defs></svg>
<div class="fondo" aria-hidden="true" id="fondo"><svg class="oso-grande" viewBox="0 0 200 220"><use href="#oso"/></svg></div>

<div class="wrap">
  <header>
    <div class="txt">
      <h1>Regalos para Frijolito</h1>
      <p class="lead">Escribe tu nombre, elige un regalo de la lista y resérvalo para que nadie más lo repita.</p>
    </div>
    <svg class="oso-mini" viewBox="0 0 200 220" aria-hidden="true"><use href="#oso"/></svg>
  </header>

  <section class="progress" aria-live="polite">
    <div class="progress-top">
      <span class="big" id="pTxt">Cargando…</span>
      <span class="count" id="pSub"></span>
    </div>
    <div class="bar"><i id="pBar"></i></div>
  </section>

  <section class="card">
    <h2>¿Quién(es) regalan?</h2>
    <div class="nombres" id="nombres">
      <input type="text" placeholder="Tu nombre" maxlength="80" autocomplete="name">
    </div>
    <div class="actions"><button type="button" class="btn ghost" id="add">+ Agregar acompañante</button></div>
  </section>

  <div class="chips" role="group" aria-label="Filtrar regalos">
    <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
    <button class="chip" data-f="faltan" aria-pressed="false">Lo que falta</button>
    <button class="chip" data-f="listos" aria-pressed="false">Ya elegidos</button>
  </div>

  <main id="lista"><div class="list"><p class="empty">Cargando la lista de regalos…</p></div></main>

  <div class="actions">
    <button class="btn primary" id="enviar" disabled>Reservar regalo</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
</div>

<dialog id="confirmar" aria-labelledby="cTitulo">
  <h2 id="cTitulo">¿Estás seguro?</h2>
  <p>Vas a reservar <strong id="cRegalo"></strong> a nombre de <strong id="cNombres"></strong>.</p>
  <p>Una vez reservado <strong>no se podrá cambiar el regalo ni los nombres</strong>.</p>
  <div class="actions">
    <button type="button" class="btn ghost" id="cNo">Revisar</button>
    <button type="button" class="btn primary" id="cSi">Sí, reservar</button>
  </div>
</dialog>

<script>
(function(){
  const f=document.getElementById('fondo');
  const reducido=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function crear(nueva){
    const b=document.createElement('span'); b.className='burbuja';
    const size=14+Math.round(Math.random()*46); b.style.width=b.style.height=size+'px';
    b.style.left=(Math.random()*100)+'%';
    const dur=reducido?5+Math.random()*5:8+Math.random()*10;
    b.style.animationDuration=dur+'s'; b.style.animationDelay=(-Math.random()*dur)+'s';
    if(reducido) b.style.top=(Math.random()*95)+'%';
    b.addEventListener('pointerdown',()=>{
      if(b.classList.contains('pop')) return;
      b.classList.add('pop');
      setTimeout(()=>{ b.remove(); crear(true); },250);
    });
    if(nueva) b.style.opacity='0';
    f.append(b);
    if(nueva) requestAnimationFrame(()=>requestAnimationFrame(()=>{ b.style.opacity=''; }));
  }
  for(let k=0;k<26;k++) crear(false);
})();

const $ = s => document.querySelector(s);
const state = { regalos:[], filtro:'todos', seleccionado:null, enviando:false, hecho:false };

function el(tag, attrs={}, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class') e.className=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{ if(k!=null) e.append(k instanceof Node?k:document.createTextNode(String(k))); });
  return e;
}

function mensaje(txt, tipo=''){ const m=$('#msg'); m.textContent=txt; m.className='msg '+tipo; }

function limpiarLink(v){
  try{ const u=new URL(v); return /^https?:$/.test(u.protocol)?u.href:''; }catch(e){ return ''; }
}
function tienda(href){ try{ return new URL(href).hostname.replace(/^www\./,''); }catch(e){ return ''; } }

function nombres(){
  return [...document.querySelectorAll('#nombres input')].map(i=>i.value.trim()).filter(Boolean);
}

function actualizarBoton(){
  $('#enviar').disabled = state.seleccionado===null || !nombres().length || state.enviando || state.hecho;
}

function render(){
  const total=state.regalos.length;
  const elegidos=state.regalos.filter(g=>g.reservado).length;
  $('#pTxt').textContent = total ? `${elegidos} de ${total} regalos elegidos` : 'La lista está vacía';
  $('#pSub').textContent = total ? `${total-elegidos} por elegir` : '';
  $('#pBar').style.width = total ? (100*elegidos/total)+'%' : '0';

  const main=$('#lista'); main.replaceChildren();
  if(!total){ main.append(el('div',{class:'list'},el('p',{class:'empty'},'Todavía no hay regalos en la lista.'))); return; }

  const visibles=state.regalos.filter(g=>state.filtro==='todos'||(state.filtro==='faltan'?!g.reservado:g.reservado));
  if(!visibles.length){
    main.append(el('div',{class:'list'},el('p',{class:'empty'}, state.filtro==='faltan'?'¡Todos los regalos ya fueron elegidos!':'Todavía nadie ha elegido un regalo.')));
    return;
  }
  main.append(el('div',{class:'list'}, visibles.map(itemRow)));
}

function itemRow(g){
  const radio=el('input',{type:'radio',name:'regalo',value:String(g.id),'aria-label':g.nombre});
  radio.disabled=g.reservado || state.hecho;
  radio.checked = state.seleccionado===g.id && !g.reservado;
  radio.addEventListener('change',()=>{ state.seleccionado=g.id; actualizarBoton(); });
  const row=el('label',{class:'item'+(g.reservado?' taken':'')}, radio, el('span',{class:'name'},g.nombre));
  const href=g.url?limpiarLink(g.url):'';
  if(g.reservado) row.append(el('span',{class:'pill listo'},'Ya elegido'));
  else if(href) row.append(el('a',{class:'prod',href,target:'_blank',rel:'noopener noreferrer',onclick:e=>e.stopPropagation()},'Ver modelo ↗'));
  return row;
}

async function cargar(){
  try{
    const res=await fetch('/api/regalos');
    if(!res.ok) throw new Error();
    state.regalos=await res.json();
  }catch(e){
    $('#pTxt').textContent='No se pudo cargar la lista';
    $('#lista').replaceChildren(el('div',{class:'list'},el('p',{class:'empty'},'Revisa tu conexión y recarga la página.')));
    return;
  }
  const sel=state.regalos.find(g=>g.id===state.seleccionado);
  if(!sel || sel.reservado) state.seleccionado=null;
  render(); actualizarBoton();
}

document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  state.filtro=b.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
}));

$('#nombres').addEventListener('input',actualizarBoton);

$('#add').addEventListener('click',()=>{
  if($('#nombres').children.length>=10) return;
  const i=el('input',{type:'text',placeholder:'Nombre del acompañante',maxlength:'80'});
  $('#nombres').append(i); i.focus();
});

$('#enviar').addEventListener('click',()=>{
  const lista=nombres();
  if(!lista.length){ mensaje('Escribe al menos tu nombre.','err'); $('#nombres input').focus(); return; }
  const g=state.regalos.find(x=>x.id===state.seleccionado);
  if(!g) return;
  $('#cRegalo').textContent=g.nombre;
  $('#cNombres').textContent=lista.join(', ');
  $('#confirmar').showModal();
});

$('#cNo').addEventListener('click',()=>$('#confirmar').close());
$('#cSi').addEventListener('click',()=>{ $('#confirmar').close(); reservar(); });

async function reservar(){
  const lista=nombres();
  if(!lista.length || state.seleccionado===null) return;
  state.enviando=true; actualizarBoton(); mensaje('');
  try{
    const res=await fetch('/api/reservar',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({regalo_id:state.seleccionado,nombres:lista}),
    });
    const data=await res.json().catch(()=>({}));
    if(data.ok){
      state.hecho=true;
      mensaje('¡Listo! Tu regalo quedó reservado 🎁 Gracias.','ok');
    }else if(res.status===409){
      mensaje('Ese regalo acaba de ser elegido por otra persona. Escoge otro, por favor.','err');
    }else{
      mensaje(data.error||'No se pudo reservar. Inténtalo de nuevo.','err');
    }
  }catch(e){
    mensaje('No se pudo reservar. Revisa tu conexión e inténtalo de nuevo.','err');
  }
  state.enviando=false;
  await cargar();
}

cargar();
</script>
</body>
</html>
